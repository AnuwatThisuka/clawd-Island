name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Ad-hoc signed (no Developer ID secrets in CI). Users may need to
      # right-click > Open on first launch. Override SIGN_ID/NOTARY_PROFILE
      # locally for a notarized build.
      - name: Build app + zip
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
        run: bash scripts/make-app.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClawdIsland.zip
          generate_release_notes: true
